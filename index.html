<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anlık Sohbet ve Arkadaşlık</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; }
    .container { width: 95%; max-width: 900px; height: 85vh; background: #1e293b; border-radius: 12px; overflow: hidden; display: flex; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    
    /* Ana Uygulama Ekranı (Direkt açılır) */
    #app-screen { display: flex; width: 100%; height: 100%; }
    .sidebar { width: 320px; background: #1e293b; border-right: 1px solid #334155; display: flex; flex-direction: column; }
    .user-header { padding: 15px; background: #0f172a; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    .section-title { padding: 10px 15px; font-size: 12px; text-transform: uppercase; color: #94a3b8; font-weight: bold; background: #1e293b; }
    .list-container { flex: 1; overflow-y: auto; }
    .user-item { padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; cursor: pointer; transition: 0.2s; }
    .user-item:hover, .user-item.active { background: #334155; }
    .btn-sm { padding: 6px 10px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; font-weight: bold; }
    button { background: #3b82f6; color: white; transition: 0.2s; }
    button:hover { background: #2563eb; }
    button.danger { background: #ef4444; }
    button.danger:hover { background: #dc2626; }

    /* Sohbet Alanı */
    .chat-area { flex: 1; display: flex; flex-direction: column; background: #0f172a; }
    .chat-header { padding: 15px; background: #1e293b; border-bottom: 1px solid #334155; font-weight: bold; }
    .messages-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .msg { max-width: 70%; padding: 10px 14px; border-radius: 10px; font-size: 14px; line-height: 1.4; }
    .msg.sent { align-self: flex-end; background: #3b82f6; color: white; border-bottom-right-radius: 2px; }
    .msg.received { align-self: flex-start; background: #334155; color: #f8fafc; border-bottom-left-radius: 2px; }
    .chat-input { padding: 15px; background: #1e293b; display: flex; gap: 10px; border-top: 1px solid #334155; }
    .chat-input input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: white; outline: none; font-size: 15px; }
  </style>
</head>
<body>

<div class="container">
  <!-- ANA UYGULAMA EKRANI -->
  <div id="app-screen">
    <div class="sidebar">
      <div class="user-header">
        <span id="current-user-name" style="font-weight: bold;">Yükleniyor...</span>
        <button class="btn-sm danger" onclick="resetProfile()">İsim Değiştir</button>
      </div>

      <div class="section-title">Arkadaşlarım (Sohbet İçin Tıkla)</div>
      <div class="list-container" id="friends-list" style="max-height: 45%;"></div>

      <div class="section-title">Sitedeki Diğer Kişiler</div>
      <div class="list-container" id="all-users-list"></div>
    </div>

    <div class="chat-area">
      <div class="chat-header" id="chat-with-header">Sohbet etmek için soldan bir arkadaş seçin</div>
      <div class="messages-box" id="messages-box"></div>
      <div class="chat-input" id="chat-input-area" style="display: none;">
        <input type="text" id="message-input" placeholder="Mesajınızı yazın..." onkeypress="if(event.key==='Enter') sendMessage()" />
        <button class="btn-sm" onclick="sendMessage()" style="padding: 0 20px;">Gönder</button>
      </div>
    </div>
  </div>
</div>

<script>
  // BURAYA KENDİ SUPABASE BİLGİLERİNİZİ GİRİN
  const SUPABASE_URL = 'BURAYA_SUPABASE_PROJECT_URL_YAPISTIRIN';
  const SUPABASE_ANON_KEY = 'BURAYA_SUPABASE_ANON_KEY_YAPISTIRIN';

  const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentUser = null;
  let selectedFriend = null;

  // Sayfa açıldığında otomatik olarak bağlan veya rastgele kullanıcı oluştur
  window.onload = async () => {
    let savedUser = localStorage.getItem('chat_user');
    
    if (savedUser) {
      try {
        const parsed = JSON.parse(savedUser);
        const { data } = await db.from('profiles').select('*').eq('id', parsed.id).single();
        if (data) {
          currentUser = data;
          initApp();
          return;
        }
      } catch (e) {
        localStorage.removeItem('chat_user');
      }
    }

    // Kayıtlı profil yoksa otomatik rastgele isimle veritabanına kaydol ve gir
    const randomName = 'Misafir_' + Math.floor(1000 + Math.random() * 9000);
    const { data, error } = await db
      .from('profiles')
      .insert([{ username: randomName }])
      .select()
      .single();

    if (error) {
      alert('Supabase bağlantı hatası: ' + error.message);
      return;
    }

    currentUser = data;
    localStorage.setItem('chat_user', JSON.stringify(currentUser));
    initApp();
  };

  function resetProfile() {
    localStorage.removeItem('chat_user');
    location.reload();
  }

  async function initApp() {
    document.getElementById('current-user-name').innerText = '👤 ' + currentUser.username;
    await loadUsersAndFriends();
    listenRealtime();
  }

  async function loadUsersAndFriends() {
    const { data: allProfiles } = await db
      .from('profiles')
      .select('*')
      .neq('id', currentUser.id)
      .order('created_at', { ascending: false });

    const { data: friendships } = await db
      .from('friendships')
      .select('*')
      .or(`user_id.eq.${currentUser.id},friend_id.eq.${currentUser.id}`);

    const friendIds = new Set();
    (friendships || []).forEach(f => {
      friendIds.add(f.user_id === currentUser.id ? f.friend_id : f.user_id);
    });

    const friendsListEl = document.getElementById('friends-list');
    const allUsersListEl = document.getElementById('all-users-list');
    friendsListEl.innerHTML = '';
    allUsersListEl.innerHTML = '';

    (allProfiles || []).forEach(user => {
      if (friendIds.has(user.id)) {
        const div = document.createElement('div');
        div.className = 'user-item' + (selectedFriend?.id === user.id ? ' active' : '');
        div.innerHTML = `<span>🟢 ${user.username}</span>`;
        div.onclick = () => selectFriend(user);
        friendsListEl.appendChild(div);
      } else {
        const div = document.createElement('div');
        div.className = 'user-item';
        div.innerHTML = `
          <span>👤 ${user.username}</span>
          <button class="btn-sm" onclick="addFriend('${user.id}')">Arkadaş Ekle</button>
        `;
        allUsersListEl.appendChild(div);
      }
    });
  }

  async function addFriend(friendId) {
    const { error } = await db.from('friendships').insert([
      { user_id: currentUser.id, friend_id: friendId }
    ]);
    if (error) {
      alert('Eklenemedi: ' + error.message);
    } else {
      await loadUsersAndFriends();
    }
  }

  async function selectFriend(friend) {
    selectedFriend = friend;
    document.getElementById('chat-with-header').innerText = `Sohbet: ${friend.username}`;
    document.getElementById('chat-input-area').style.display = 'flex';
    await loadUsersAndFriends();
    await loadMessages();
  }

  async function loadMessages() {
    if (!selectedFriend) return;
    const { data: messages } = await db
      .from('messages')
      .select('*')
      .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${selectedFriend.id}),and(sender_id.eq.${selectedFriend.id},receiver_id.eq.${currentUser.id})`)
      .order('created_at', { ascending: true });

    const box = document.getElementById('messages-box');
    box.innerHTML = '';
    (messages || []).forEach(renderMessage);
    box.scrollTop = box.scrollHeight;
  }

  function renderMessage(msg) {
    const box = document.getElementById('messages-box');
    const div = document.createElement('div');
    div.className = 'msg ' + (msg.sender_id === currentUser.id ? 'sent' : 'received');
    div.innerText = msg.content;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  async function sendMessage() {
    const input = document.getElementById('message-input');
    const content = input.value.trim();
    if (!content || !selectedFriend) return;

    input.value = '';
    await db.from('messages').insert([
      { sender_id: currentUser.id, receiver_id: selectedFriend.id, content }
    ]);
  }

  function listenRealtime() {
    db.channel('public-chat')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
        const msg = payload.new;
        if (
          selectedFriend &&
          ((msg.sender_id === currentUser.id && msg.receiver_id === selectedFriend.id) ||
           (msg.sender_id === selectedFriend.id && msg.receiver_id === currentUser.id))
        ) {
          renderMessage(msg);
        }
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'friendships' }, () => {
        loadUsersAndFriends();
      })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'profiles' }, () => {
        loadUsersAndFriends();
      })
      .subscribe();
  }
</script>

</body>
</html>
